name: Bank App CI — Unit & Integration Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Build & Test (Java / Spring Boot)
    runs-on: ubuntu-latest

    # ─────────────────────────────────────────
    # Optional: spin up a PostgreSQL database
    # for integration tests. Remove this block
    # if you use H2 in-memory for testing.
    # ─────────────────────────────────────────
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: bankapp_test
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:

      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Java 17 (change to 11 or 21 if needed)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Cache Maven dependencies (speeds up builds)
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # 4. Run unit tests only (fast, no DB needed)
      - name: Run unit tests
        run: mvn test -Dtest="**/*UnitTest,**/*Test" -DfailIfNoTests=false
        env:
          SPRING_PROFILES_ACTIVE: test

      # 5. Run integration tests (uses the PostgreSQL service above)
      - name: Run integration tests
        run: mvn verify -P integration-tests -DfailIfNoTests=false
        env:
          SPRING_PROFILES_ACTIVE: integration
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/bankapp_test
          SPRING_DATASOURCE_USERNAME: testuser
          SPRING_DATASOURCE_PASSWORD: testpassword

      # 6. Upload test reports so you can view results in GitHub UI
      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          retention-days: 7

      # 7. Upload code coverage report (if you use JaCoCo)
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: target/site/jacoco/
          retention-days: 7